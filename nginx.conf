proxy_cache_path /tmp/nginx_cache keys_zone=shop_cache:10m max_size=100m inactive=60m use_temp_path=off;

gzip on;

gzip_types
    text/plain
    text/css
    application/json
    application/javascript
    application/xml
    application/xml+rss;

map $request_method $backend {
    GET shop_backend;
    default shop_main_backend;
}

upstream shop_backend {
    server api-main:8000 weight=2;
    server api-read1:8000 weight=1;
    server api-read2:8000 weight=1;
}

upstream shop_main_backend {
    server api-main:8000;
}

server {
    listen 80;
    server_name shop;

    return 301 https://shop$request_uri;
}

server {
    listen 443 ssl;
    server_name shop;

    ssl_certificate /etc/nginx/certs/shop.crt;
    ssl_certificate_key /etc/nginx/certs/shop.key;

    root /usr/share/nginx/html;
    index index.html;
    
    error_page 404 /404.html;

    location /404.html {
        internal;        
    }

    location / {
        try_files $uri $uri/ =404;
        expires 1h;
    }

    #статус nginix
    location /status {
        stub_status;        
    }

    # само апи
    location /api/ {
        rewrite ^/api/(.*)$ /api/v1/$1 break;
        proxy_pass http://$backend;
    }

    location /api/v1/ {
        proxy_pass http://$backend;
    }

    location = /api/v1 {
        proxy_pass http://shop_main_backend/swagger/index.html;        
    }

    location = /openapi.json {
        proxy_pass http://shop_main_backend/openapi.json;    

    }

    location /swagger-ui-theme-static/ {
        proxy_pass http://shop_main_backend;
    }

    # админка пгадмина
    location /admin {
        return 301 /admin/;
    }

    location /admin/ {
        proxy_set_header X-Script-Name /admin;
        proxy_set_header Host $host;

        proxy_pass http://pgadmin:80/;
        proxy_redirect  off;

        proxy_cache shop_cache;
        proxy_cache_methods GET;
    }
}