<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой учебный проект в WSL</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e2f 0%, #11111b 100%);
            color: #cdd6f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: rgba(30, 30, 46, 0.8);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            max-width: 500px;
            backdrop-filter: blur(10px);
        }
        h1 {
            color: #a6e3a1;
            margin-top: 0;
            font-size: 2.5rem;
        }
        p {
            color: #a6adc8;
            line-height: 1.6;
            font-size: 1.1rem;
        }
        .status {
            display: inline-block;
            background: #313244;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            color: #f38ba8;
            border: 1px solid #f38ba8;
            margin-top: 15px;
            animation: pulse 2s infinite;
        }
        .badge {
            background: #89b4fa;
            color: #11111b;
            padding: 4px 10px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.9rem;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(243, 139, 168, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(243, 139, 168, 0); }
            100% { box-shadow: 0 0 0 0 rgba(243, 139, 168, 0); }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Работает! 🚀</h1>
        <p>Ваш сервер <strong>Nginx</strong> успешно прочитал этот файл из вашей домашней папки в WSL и отдал его в браузер Windows!</p>
        <p>Текущий путь к файлу: <span class="badge">src/static/index.html</span></p>
        <div class="status">Nginx: Active & Running</div>
    </div>
</body>
</html>
