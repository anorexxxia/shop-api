<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Страница не найдена</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-color: #c9d1d9;
            --accent-color: #2ea44f;
            --error-color: #da3633;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            max-width: 450px;
            width: 100%;
        }

        .error-code {
            font-size: 72px;
            font-weight: bold;
            color: var(--error-color);
            margin: 0 0 10px 0;
            letter-spacing: 2px;
        }

        .status {
            display: inline-block;
            background-color: rgba(218, 54, 51, 0.1);
            color: var(--error-color);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 14px;
            border: 1px solid rgba(218, 54, 51, 0.2);
            margin-bottom: 20px;
        }

        h1 {
            font-size: 20px;
            margin: 0 0 15px 0;
            color: #fff;
        }

        p {
            font-size: 14px;
            color: #8b949e;
            line-height: 1.6;
            margin: 0 0 30px 0;
        }

        .btn {
            display: inline-block;
            background-color: var(--accent-color);
            color: #fff;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: #2c974b;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="error-code">404</div>
        <div class="status">● ERR_NOT_FOUND</div>
        <h1>Упс! Маршрут не найден</h1>
        <p>Nginx обработал ваш запрос, но на жестком диске сервера или в правилах бэкенда такой страницы не существует.</p>
        <a href="/" class="btn">Вернуться на главную</a>
    </div>

</body>
</html>
